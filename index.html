<!doctype html>
<html lang="en" class="story-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.codeSpire</title>
  </head>
  <body class="index-body">
    <header data-site-header></header>
    <main class="index-main">
      <aside class="index-main__aside">
        <img
          src="/src/assets/images/storybanner.png"
          alt="Banner with story elements"
          loading="lazy"
          width="100"
          height="100"
        />
        <button
          class="index-main__aside-story-button index-main__aside-intro-button"
          type="button"
          data-story-page="/pages/story/intro.html"
        >
          <span>Intro</span>
        </button>
        <button
          class="index-main__aside-story-button index-main__aside-prologue-button"
          type="button"
          data-story-page="/pages/story/prologue.html"
        >
          <span>Prologue</span>
        </button>
        <button
          class="index-main__aside-story-button index-main__aside-chapter1-button"
          type="button"
          data-story-page="/pages/story/chapter1.html"
        >
          <span>Chapter 1</span>
        </button>
        <button
          class="index-main__aside-story-button index-main__aside-chapter2-button"
          type="button"
          data-story-page="/pages/story/chapter2.html"
        >
          <span>Chapter 2</span>
        </button>
        <button
          class="index-main__aside-story-button index-main__aside-chapter3-button"
          type="button"
          data-story-page="/pages/story/chapter3.html"
        >
          <span>Chapter 3</span>
        </button>
        <button
          class="index-main__aside-story-button index-main__aside-chapter4-button"
          type="button"
          data-story-page="/pages/story/chapter4.html"
        >
          <span>Chapter 4</span>
        </button>
        <button
          class="index-main__aside-story-button index-main__aside-chapter5-button"
          type="button"
          data-story-page="/pages/story/chapter5.html"
        >
          <span>Chapter 5</span>
        </button>
      </aside>
      <iframe
        id="story-iframe"
        class="index-main__story"
        src="/pages/story/prologue.html"
        title="Story"
      >
      </iframe>
      <article class="index-main__intro">
        <!-- <iframe class="index-main__intro" src="/pages/story/prologue.html" src="/pages/story/intro.html" title="Story"></iframe> -->
        <a href="/pages/lobby.html" class="index-main__pressplay"
          >Press to play</a
        >

        <img
          class="index-main__tombstone"
          src="/src/assets/images/tombstone.png"
          alt="overgrown tombstone"
          loading="lazy"
          height="100"
          width="100"
        />
      </article>
    </main>

    <footer data-site-footer></footer>

    <script type="module" src="/src/js/pages/index.js"></script>
  </body>
</html>
