<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSpire — Character Creation</title>
    <meta
      name="description"
      content="Create your hero: pick a name and a class, then start your climb."
    />
  </head>

  <body class="page-createplayer">
    <header data-site-header></header>

    <main class="site-createplayer">
      <p class="site-createplayer__subtitle">Code! Fight! Up!</p>
      <section class="site-createplayer-container">
        <h1 class="site-createplayer-container__title">
          Create your character
        </h1>
        <form class="site-createplayer-container__form">
          <label class="site-createplayer-container__label" for="player-name">
            Name
          </label>
          <input
            class="site-createplayer-container__input"
            id="player-name"
            type="text"
            name="player-name"
            maxlength="20"
            required
            autocomplete="off"
            aria-describedby="name-error"
          />
          <p
            class="site-createplayer-container__error"
            id="name-error"
            aria-live="polite"
          ></p>
          <p
            class="site-createplayer-container__label site-createplayer-container__label--class"
            id="player-class"
          >
            Class: Warrior
          </p>
          <div class="site-createplayer-container__avatar">
            <button
              type="button"
              class="site-createplayer-container__arrow"
              id="avatar-prev"
              aria-label="Previous avatar"
            >
              &lt;
            </button>
            <img
              class="site-createplayer-container__image"
              id="avatar-image"
              src="/avatars/warrior.webp"
              alt="Warrior avatar"
              width="150"
              height="150"
            />
            <button
              type="button"
              class="site-createplayer-container__arrow"
              id="avatar-next"
              aria-label="Next avatar"
            >
              &gt;
            </button>
          </div>
          <button type="submit" class="site-createplayer-container__play-btn">
            Play
          </button>
        </form>
      </section>
      <section class="site-createplayer-lore">
        <div class="site-createplayer-lore__divider">
          <span></span>
          <div class="site-createplayer-lore__diamond"></div>
          <span></span>
        </div>
        <h2 class="site-createplayer-lore__title">HERE BEGINS THE CLIMB</h2>
        <p>
          Ancient towers guard forgotten knowledge. Strong monsters stand
          between each floor.
        </p>
        <p>Solve coding challenges to advance higher into the tower.</p>
      </section>
    </main>

    <footer data-site-footer></footer>

    <script type="module" src="/src/js/pages/createplayer.js"></script>
  </body>
</html>
