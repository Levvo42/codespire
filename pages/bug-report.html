<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSpire — Bug Report</title>
    <meta name="description" content="" />
  </head>
  <body class="page-bug-report">
    <header data-site-header></header>
    <main class="bug-report">
      <h1 class="bug-report__title">Bug Report under construction</h1>
      <div class="bug-report__divider">
        <span></span>
        <div class="bug-report__diamond"></div>
        <span></span>
      </div>
      <form class="bug-report__form">
        <label class="bug-report__label" for="bug-title"> Bug title </label>
        <input class="bug-report__input" id="bug-title" type="text" required />
        <label class="bug-report__label"> Contact email (optional) </label>
        <input
          class="bug-report__input"
          id="bug-email"
          type="email"
          placeholder="name@example.com"
        />
        <label class="bug-report__label" for="bug-description">
          Describe the bug
        </label>
        <textarea
          class="bug-report__textarea"
          id="bug-description"
          rows="6"
          required
        >
        </textarea>
        <label class="bug-report__label" for="bug-image">
          Attach image (optional)
        </label>
        <input
          class="bug-report__input"
          id="bug-image"
          type="file"
          accept="image/*"
        />
        <button class="bug-report__button" type="submit">Submit Report</button>
      </form>
    </main>
    <footer data-site-footer></footer>
    <script type="module" src="/src/js/pages/bug-report.js"></script>
  </body>
</html>
