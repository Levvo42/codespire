<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSpire — Lobby</title>
    <meta name="description" content="" />
  </head>

  <body>
    <header class="site-header">
      <img
        src="/src/assets/images/placeholderlogo.png"
        loading="eager"
        class="site-header__logo"
        alt=""
      />
      <nav class="site-header__menu">
        <a href="./pages/createplayer.html">Play</a>
        <a href="">Story</a>
        <a href="">Shop</a>
        <a href="./pages/tutorial.html">Tutorial</a>
      </nav>
    </header>

    <main class="site-lobby">
      <h1>Lobby</h1>
      <!--Main Tower-->
      <section class="site-lobby__scene">
        <div class="site.lobby__scene--tower">
          <img
            src="/src/assets/images/placeholder_400x1000.svg"
            alt="Main tower"
            width="400"
            height="1000"
          />
          <p class="lobby__sign" aria-live="polite">Level</p>
        </div>
      </section>
      <!--Main Selection-->
      <section class="site-lobby__select">
        <button
          class="site-lobby__button site-lobby__botton--left"
          type="button"
        >
          Left
        </button>
        <button
          class="site-lobby__button site-lobby__botton--right"
          type="button"
        >
          Right
        </button>
        <button
          class="site-lobby__button site-lobby__botton--play"
          type="button"
        >
          Play
        </button>
      </section>

      <article class="site-lobby__stats" id="panel-stats">
        <h2>Stats</h2>
      </article>
      <article class="site-lobby__player">
        <button
          type="button"
          class="lobby__toggle"
          aria-controls="panel-stats"
          aria-expanded="false"
        >
          Stats
        </button>
        <h2>Player</h2>
        <button
          type="button"
          class="lobby__toggle"
          aria-controls="panel-inventory"
          aria-expanded="false"
        >
          Stats
        </button>
      </article>
      <article class="site-lobby__inventory" id="panel-inventory">
        <h2>Inventory</h2>
      </article>
    </main>

    <script type="module" src="/src/js/pages/lobby.js"></script>
  </body>
</html>
