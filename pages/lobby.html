<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSpire — Lobby</title>
    <meta name="description" content="" />
  </head>

  <body class="page-lobby">
    <!-- Header (same as index.html, main.js needs the menu button) -->
    <header class="site-header">
      <img
        src="/src/assets/images/placeholderlogo.png"
        loading="eager"
        class="site-header__logo"
        alt=""
      />
      <nav class="site-header__nav" id="header-navigation">
        <a href="/pages/createplayer.html">Play</a>
        <a href="/index.html">Menu</a>
        <a href="/pages/lobby.html">Lobby</a>
        <a href="/pages/tutorial.html">Tutorial</a>
      </nav>
      <button
        class="site-header__menu-button"
        type="button"
        aria-expanded="false"
        aria-controls="header-navigation"
      >
        <img
          src="/src/assets/images/hamburger-menu.png"
          alt=""
          height="20"
          width="20"
        />
        <span class="visually-hidden">Menu</span>
      </button>
    </header>

    <main class="site-lobby">
      <h1 class="site-lobby__title">Lobby</h1>

      <!-- Scene: background, tower and level sign -->
      <section class="site-lobby__scene">
        <div class="site-lobby__tower">
          <img
            src="/src/assets/images/tower.webp"
            alt="Main tower"
            width="900"
            height="1558"
          />
          <p class="site-lobby__sign" aria-live="polite">Level</p>
        </div>
      </section>

      <!-- Platform: level select stones -->
      <section class="site-lobby__select" aria-label="Level select">
        <button
          class="site-lobby__button site-lobby__button--left"
          type="button"
          aria-label="Previous level"
        >
          <span class="site-lobby__label" aria-hidden="true">ᚱ</span>
          <span class="site-lobby__hint" aria-hidden="true">Prev.</span>
        </button>
        <button
          class="site-lobby__button site-lobby__button--right"
          type="button"
          aria-label="Next level"
        >
          <span class="site-lobby__label" aria-hidden="true">ᚱ</span>
          <span class="site-lobby__hint" aria-hidden="true">Next</span>
        </button>
        <button
          class="site-lobby__button site-lobby__button--play"
          type="button"
          aria-label="Play"
        >
          <span class="site-lobby__label" aria-hidden="true">ᛞ</span>
          <span class="site-lobby__hint" aria-hidden="true">Play</span>
        </button>
      </section>

      <!-- Panels: stats | player | inventory -->
      <article
        class="site-lobby__panel site-lobby__panel--stats"
        id="panel-stats"
      >
        <h2>Stats</h2>
      </article>

      <article class="site-lobby__panel site-lobby__panel--player">
        <button
          class="site-lobby__toggle site-lobby__toggle--stats"
          type="button"
          aria-controls="panel-stats"
          aria-expanded="false"
        >
          Stats
        </button>
        <div class="site-lobby__player-content">
          <h2>Player</h2>
        </div>
        <button
          class="site-lobby__toggle site-lobby__toggle--inventory"
          type="button"
          aria-controls="panel-inventory"
          aria-expanded="false"
        >
          Inventory
        </button>
      </article>

      <article
        class="site-lobby__panel site-lobby__panel--inventory"
        id="panel-inventory"
      >
        <h2>Inventory</h2>
      </article>
    </main>

    <footer class="site-footer"></footer>

    <script type="module" src="/src/js/pages/lobby.js"></script>
  </body>
</html>
