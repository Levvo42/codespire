<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSpire — Lobby</title>
    <meta name="description" content="" />
  </head>

  <body class="page-lobby">
    <header class="site-header">
      <img
        src="/src/assets/images/placeholderlogo.png"
        loading="eager"
        class="site-header__logo"
        alt=""
      />
      <nav class="site-header__menu">
        <a href="./pages/createplayer.html">Play</a>
        <a href="">Story</a>
        <a href="">Shop</a>
        <a href="./pages/tutorial.html">Tutorial</a>
      </nav>
    </header>

    <main class="site-lobby">
      <!-- <a href='https://pngtree.com/freepng/medieval-stone-castle-tower-with-wooden-door-and-mossy-walls_23400916.html'>png image from pngtree.com/</a> -->
      <h1>Lobby</h1>

      <!--Main Tower-->
      <section class="site-lobby__scene">
        <div class="site-lobby__stage">
          <div class="site-lobby__tower">
            <img
              src="/src/assets/images/medival-tower.png"
              alt="Main tower"
              width="3072"
              height="3072"
            />
            <p class="site-lobby__sign" aria-live="polite">Level</p>
          </div>
        </div>
      </section>

      <!--Selection-->
      <section class="site-lobby__select">
        <button
          class="site-lobby__button site-lobby__button--left"
          type="button"
        >
          Left
        </button>
        <button
          class="site-lobby__button site-lobby__button--right"
          type="button"
        >
          Right
        </button>
        <button
          class="site-lobby__button site-lobby__button--play"
          type="button"
        >
          Play
        </button>
      </section>

      <article class="site-lobby__stats" id="panel-stats">
        <h2>Stats</h2>
      </article>
      <article class="site-lobby__player">
        <button
          type="button"
          class="site-lobby__toggle"
          aria-controls="panel-stats"
          aria-expanded="false"
        >
          Stats
        </button>
        <h2>Player</h2>
        <button
          type="button"
          class="site-lobby__toggle"
          aria-controls="panel-inventory"
          aria-expanded="false"
        >
          Inventory
        </button>
      </article>
      <article class="site-lobby__inventory" id="panel-inventory">
        <h2>Inventory</h2>
      </article>
    </main>
    <footer class="site-footer"></footer>

    <script type="module" src="/src/js/pages/lobby.js"></script>
  </body>
</html>
